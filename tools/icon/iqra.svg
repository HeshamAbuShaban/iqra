<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!--
    Iqra launcher icon, v6.

    v1-v3 were an open book with three identical rules per page; they were
    rejected in review for reading as a notebook, and each revision removed
    something rather than changing the idea, which just converges on "notebook".

    v4 put one line in gold to say "this is the line you are on", which is the
    right idea and the wrong drawing: the ring that ended it read as a key at
    48px, and the page tops bowed upward on BOTH pages, so the two peaks made an
    M at the gutter instead of a V.

    v5 fixes the drawing and drops the ring. The top edge now falls from the
    outer corner to the spine and the bottom edge rises to meet it, so the pair
    of pages makes one clean V - the shape that reads as an open book at any
    size. One line is resolved (heavier, gold, full measure) and three recede.
    A difference in weight survives downscaling; a ring does not.

    Geometry is mirrored about x=54 by construction and every rule on the left
    has a twin on the right at the reflected coordinate. Ink stays inside
    21..87 so an adaptive-icon mask cannot clip it.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#15684E"/>
      <stop offset="1" stop-color="#072E23"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0.3" x2="1" y2="0.7">
      <stop offset="0" stop-color="#FCF8EC"/>
      <stop offset="1" stop-color="#EADFC4"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0.3" x2="0" y2="0.7">
      <stop offset="0" stop-color="#FCF8EC"/>
      <stop offset="1" stop-color="#EADFC4"/>
    </linearGradient>
  </defs>

  <rect width="108" height="108" fill="url(#field)"/>

  <!-- LEFT PAGE: outer edge y 32..76, spine edge y 36.5..80, so the block
       leans and the two pages close into a single V at the gutter. -->
  <path d="M21 29 Q 36.5 29.5 52.4 34 L 52.4 81 Q 36.5 77 21 77 Z"
        fill="url(#pageL)"/>
  <!-- RIGHT PAGE, mirrored about x=54. -->
  <path d="M87 29 Q 71.5 29.5 55.6 34 L 55.6 81 Q 71.5 77 87 77 Z"
        fill="url(#pageR)"/>

  <!-- receded lines: three per page, identical measure, muted -->
  <g stroke="#BFA070" stroke-width="2.6" stroke-linecap="round" opacity="0.7">
    <path d="M27 44 H 47"/>
    <path d="M61 44 H 81"/>
    <path d="M27 62 H 47"/>
    <path d="M61 62 H 81"/>
    <path d="M27 71 H 47"/>
    <path d="M61 71 H 81"/>
  </g>

  <!-- the resolved line - the whole product in one mark -->
  <g stroke="#C08A2E" stroke-width="5" stroke-linecap="round">
    <path d="M27 53 H 47"/>
    <path d="M61 53 H 81"/>
  </g>

  <!-- spine: the fold. One flat band with a lighter core so it reads as a
       crease rather than a printed stripe. -->
  <rect x="52.4" y="34" width="3.2" height="47" fill="#A87F33"/>
  <rect x="52.4" y="34" width="1.1" height="47" fill="#D9B36B" opacity="0.8"/>
</svg>