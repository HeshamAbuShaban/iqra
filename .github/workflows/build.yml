name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# One build per ref: a new push supersedes an in-flight run instead of racing
# it to the same APK identity.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned, not ubuntu-latest: that label migrates to Ubuntu 26 on
    # 2026-10-19, and the SDK path and preinstalled packages are part of this
    # job's contract. A migration is a build change and needs its own commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # versionCode is the commit count (android/app/build.gradle.kts), and
          # the release tag prints the same number. A shallow clone counts one
          # commit and stamps every CI build versionCode 1 - the exact
          # indistinguishability the commit-count scheme exists to end.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The runner image ships the SDK but neither exports it nor puts
      # cmdline-tools on PATH. Asserting the known location, and failing loudly
      # if it moves, is what 6d876ba settled on after setup-android@v3 broke;
      # removing this step is what broke runs 198/199.
      - name: Setup Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          if [ ! -d "$SDK/cmdline-tools" ]; then
            echo "runner image moved the Android SDK; fix this step, do not delete it"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          CT=$(ls -d $SDK/cmdline-tools/*/ | sort | tail -1)
          echo "${CT}bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools" >> $GITHUB_PATH

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Fetch token assets (model is downloaded on first launch)
        run: SKIP_MODEL=1 IQRA_SKIP_PAGES=1 bash scripts/fetch_assets.sh

      # The measurement gate, before the build, so a broken invariant fails in
      # about 15 seconds instead of after a full Android build. These checks
      # import nothing outside the standard library - no sherpa, no numpy, no
      # audio - so no dependency setup is needed. The checks that DO need the
      # gated model report SKIPPED here, loudly, because a skipped check that
      # looks green is how the 5.3% feed bug survived so long.
      - name: Measurement gate (model-free checks)
        run: python3 engine/replay/run_checks.py

      # The alignment kernel, executed. Until this existed, CI could compile the
      # matcher but never run it, so every proposal to change it was reviewed by
      # reading alone - and two of the three that arrived were broken. This runs
      # it and pins it to the Python reference by digest, so the next proposal
      # fails a test instead of a phone.
      - name: Alignment kernel (JVM)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # The APK must carry the number the workflow names it by. If checkout
      # ever goes shallow again, CI says so here instead of shipping an APK
      # stamped 1.
      - name: Verify APK identity
        run: |
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BADGING=$("$AAPT2" dump badging "$APK")
          APK_CODE=$(echo "$BADGING" | grep -oP "versionCode='\K[0-9]+")
          APK_NAME=$(echo "$BADGING" | grep -oP "versionName='\K[^']+")
          BUILD=$(git rev-list --count HEAD)
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          [ "$APK_CODE" = "$BUILD" ] || { echo "versionCode $APK_CODE != commit count $BUILD (shallow clone?)"; exit 1; }
          [ "$APK_NAME" = "$VERSION" ] || { echo "versionName $APK_NAME != gradle $VERSION"; exit 1; }
          echo "APK identity: $APK_NAME build #$APK_CODE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iqra-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # One release per commit, named by the same number the APK carries:
      # versionName from the gradle file, build = commit count = versionCode.
      # Re-running the job for the same commit updates the release instead of
      # failing on the existing tag.
      - name: Publish to GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          BUILD=$(git rev-list --count HEAD)
          TAG="v$VERSION-build$BUILD"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Iqra $VERSION · build $BUILD" \
              --notes "Debug APK. versionCode = $BUILD (the commit count); the record's build tag is #$BUILD."
          fi
